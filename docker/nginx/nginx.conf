events {
    worker_connections 1024;
}

http {
    upstream suitecrm_backend {
        server suitecrm:80;
    }
    
    upstream chatbot_backend {
        server chatbot:8000;
    }
    
    # Main application
    server {
        listen 80;
        server_name localhost;
        
        # SuiteCRM main application
        location / {
            proxy_pass http://suitecrm_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Chatbot API
        location /api/chatbot/ {
            proxy_pass http://chatbot_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health checks
        location /health/suitecrm {
            proxy_pass http://suitecrm_backend/index.php;
        }
        
        location /health/chatbot {
            proxy_pass http://chatbot_backend/health;
        }
    }
}