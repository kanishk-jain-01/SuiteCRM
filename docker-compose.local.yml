# Enhanced local development matching AWS setup
services:
  # Load balancer simulation (nginx)
  loadbalancer:
    image: nginx:alpine
    container_name: suitecrm_lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - suitecrm
      - chatbot
    networks:
      - suitecrm_network

  database:
    image: mysql:8.0
    container_name: suitecrm_database
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpass123}
      - MYSQL_DATABASE=suitecrm
      - MYSQL_USER=${DB_USER:-suitecrm}
      - MYSQL_PASSWORD=${DB_PASSWORD:-dev_suite_123}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - suitecrm_network

  # Redis for caching (like AWS ElastiCache)
  redis:
    image: redis:7-alpine
    container_name: suitecrm_redis
    ports:
      - "6379:6379"
    networks:
      - suitecrm_network

  suitecrm:
    build:
      context: .
      dockerfile: ./docker/suitecrm/Dockerfile
    container_name: suitecrm_app
    environment:
      - DB_HOST=database
      - DB_NAME=suitecrm
      - DB_USER=${DB_USER:-suitecrm}
      - DB_PASSWORD=${DB_PASSWORD:-dev_suite_123}
      - CHATBOT_API_URL=http://chatbot:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_MAX_FILESIZE=50M
      - PHP_POST_MAX_SIZE=50M
      - ENVIRONMENT=local
    volumes:
      - suitecrm_uploads:/var/www/html/upload
      - suitecrm_cache:/var/www/html/cache
      - suitecrm_logs:/var/www/html/logs
      - suitecrm_config_volume:/var/www/html/config-persistence
      - ./suitecrm.log:/var/www/html/suitecrm.log
    # No exposed ports - accessed through load balancer
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - suitecrm_network

  chatbot:
    build:
      context: ./suitecrm_chatbot
      dockerfile: Dockerfile
    container_name: suitecrm_chatbot
    environment:
      - SUITECRM_BASE_URL=http://suitecrm/Api/V8
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUITECRM_CLIENT_ID=${SUITECRM_CLIENT_ID}
      - SUITECRM_CLIENT_SECRET=${SUITECRM_CLIENT_SECRET}
      - SUITECRM_USERNAME=${SUITECRM_USERNAME}
      - SUITECRM_PASSWORD=${SUITECRM_PASSWORD}
      - ENVIRONMENT=local
    volumes:
      - chatbot_logs:/app/logs
    # No exposed ports - accessed through load balancer
    depends_on:
      - suitecrm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - suitecrm_network

  # Log aggregation (like AWS CloudWatch)
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: suitecrm_logs
    volumes:
      - ./docker/fluentd/fluent.conf:/fluentd/etc/fluent.conf
      - suitecrm_logs:/var/log/suitecrm
      - chatbot_logs:/var/log/chatbot
    ports:
      - "24224:24224"
    networks:
      - suitecrm_network

volumes:
  db_data:
    driver: local
  suitecrm_uploads:
    driver: local
  suitecrm_cache:
    driver: local
  suitecrm_logs:
    driver: local
  suitecrm_config_volume:
    driver: local
  chatbot_logs:
    driver: local

networks:
  suitecrm_network:
    driver: bridge